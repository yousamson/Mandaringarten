openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: billing
    description: Stripe subscription and membership operations
  - name: translation
    description: Free word and short-phrase translation
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /billing/plan:
    get:
      operationId: getBillingPlan
      tags: [billing]
      summary: Get the premium monthly plan
      responses:
        "200":
          description: Current premium monthly price
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingPlanResponse"
        "503":
          description: The premium price is not configured
  /billing/status:
    get:
      operationId: getBillingStatus
      tags: [billing]
      summary: Get the signed-in user's membership status
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Membership and cancellation status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingStatus"
        "401":
          description: Authentication required
  /billing/subscription:
    get:
      operationId: getBillingSubscription
      tags: [billing]
      summary: Get the signed-in user's subscription status
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current subscription status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingSubscriptionResponse"
        "401":
          description: Authentication required
  /billing/checkout:
    post:
      operationId: createBillingCheckout
      tags: [billing]
      summary: Create a premium subscription checkout session
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BillingCheckoutRequest"
      responses:
        "200":
          description: Stripe Checkout URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingRedirectResponse"
        "400":
          description: Invalid return URL
        "401":
          description: Authentication required
        "409":
          description: An existing subscription must be managed first
        "503":
          description: Checkout is unavailable
  /billing/portal:
    post:
      operationId: createBillingPortal
      tags: [billing]
      summary: Create a customer billing portal session
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PortalInput"
      responses:
        "200":
          description: Stripe customer portal URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingRedirectResponse"
        "400":
          description: Invalid return URL
        "401":
          description: Authentication required
        "404":
          description: No billing account exists
  /learning/progress:
    get:
      operationId: getLearningProgress
      tags: [learning]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Account learning progress
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LearningProgress" }
        "401": { description: Authentication required }
        "403": { description: Membership required }
        "503": { description: Saved progress is temporarily unavailable }
    put:
      operationId: updateLearningProgress
      tags: [learning]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LearningProgressInput" }
      responses:
        "200":
          description: Saved stage selection or monotonically merged legacy progress
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LearningProgress" }
        "400": { description: Invalid input }
        "401": { description: Authentication required }
        "403": { description: Membership and legal consent required }
        "503": { description: Saved progress is temporarily unavailable }
  /learning/round:
    post:
      operationId: recordLearningRound
      tags: [learning]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LearningRoundInput" }
      responses:
        "200":
          description: Server-validated answer and current stage XP
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LearningAnswerResult" }
        "400": { description: Invalid answer submission }
        "401": { description: Authentication required }
        "403": { description: Membership and legal consent required }
        "404": { description: Round or question identity was not issued to this account }
        "409": { description: Question identity was already used with a different answer }
        "503": { description: Saved progress is temporarily unavailable }
  /learning/rounds:
    post:
      operationId: issueLearningRound
      tags: [learning]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LearningRoundRequest" }
      responses:
        "201":
          description: Server-issued round and question identities
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LearningRound" }
        "400": { description: Invalid round request }
        "401": { description: Authentication required }
        "403": { description: Membership and legal consent required }
        "503": { description: Saved progress is temporarily unavailable }
  /learning/garden/care:
    post:
      operationId: recordGardenCare
      tags: [learning]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GardenCareInput" }
      responses:
        "200":
          description: Garden care applied and XP updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LearningProgress" }
        "400": { description: Invalid care action }
        "401": { description: Authentication required }
        "403": { description: Membership and legal consent required }
        "409": { description: More XP is needed or the garden was already cared for today }
        "503": { description: Saved progress is temporarily unavailable }
  /learning/exam/progress:
    get:
      operationId: getExamProgress
      tags: [learning]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Server-confirmed HSK and PSC level access and saved activity progress
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExamProgressResponse" }
        "401": { description: Authentication required }
        "503": { description: Exam progress is temporarily unavailable }
  /learning/exam/activity:
    post:
      operationId: recordExamActivity
      tags: [learning]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecordExamActivityInput" }
      responses:
        "200":
          description: Saved activity completion and updated level access
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExamProgressResponse" }
        "400": { description: Invalid level or activity }
        "401": { description: Authentication required }
        "403": { description: "Membership, trial or previous-level requirement not met" }
        "503": { description: Exam progress is temporarily unavailable }
  /legal/consent:
    get:
      operationId: getLegalConsent
      tags: [legal]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Current version account consent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LegalConsentStatus" }
        "401": { description: Authentication required }
    post:
      operationId: acceptLegalConsent
      tags: [legal]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LegalConsentInput" }
      responses:
        "200":
          description: Recorded policy acceptance
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LegalConsentStatus" }
        "400": { description: Every acknowledgment is required }
        "401": { description: Authentication required }
  /account/access:
    get:
      operationId: getAccountAccess
      responses:
        "200":
          description: Server-verified account access
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountAccess" }
  /account:
    delete:
      operationId: deleteAccount
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccountDeletionInput" }
      responses:
        "200":
          description: Account deleted without a refund
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountDeletionResult" }
  /support/threads:
    get:
      operationId: getSupportThreads
      responses:
        "200":
          description: Own conversations, or all conversations for a verified administrator
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SupportThread" }
    post:
      operationId: createSupportThread
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SupportThreadInput" }
      responses:
        "201":
          description: Conversation created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupportConversation" }
  /support/threads/{threadId}:
    parameters:
      - name: threadId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getSupportConversation
      responses:
        "200":
          description: Authorized conversation with messages
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupportConversation" }
  /support/threads/{threadId}/messages:
    parameters:
      - name: threadId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: sendSupportMessage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SupportMessageInput" }
      responses:
        "201":
          description: Reply saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupportConversation" }
  /translation/lookup:
    post:
      operationId: lookupTranslation
      tags: [translation]
      summary: Translate one word or a short phrase between English and Chinese
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TranslationLookupInput" }
      responses:
        "200":
          description: Translation result from MyMemory
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TranslationLookupResponse" }
        "400": { description: Invalid or oversized input }
        "429": { description: Free daily translation allowance reached }
        "503": { description: Translation service is temporarily unavailable }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]
    BillingPlanResponse:
      type: object
      properties:
        unitAmount:
          type: integer
        currency:
          type: string
        interval:
          type: string
        priceLabel:
          type: string
      required: [unitAmount, currency, interval, priceLabel]
    BillingStatus:
      type: object
      properties:
        isPremium:
          type: boolean
        subscriptionStatus:
          type: string
        currentPeriodEnd:
          type: ["string", "null"]
        cancelAtPeriodEnd:
          type: boolean
      required: [isPremium, subscriptionStatus, currentPeriodEnd, cancelAtPeriodEnd]
    BillingSubscriptionResponse:
      type: object
      properties:
        isPremium:
          type: boolean
        hasBillingCustomer:
          type: boolean
        subscriptionStatus:
          type: string
          nullable: true
        currentPeriodEnd:
          type: integer
          nullable: true
      required: [isPremium, hasBillingCustomer, subscriptionStatus, currentPeriodEnd]
    BillingCheckoutRequest:
      oneOf:
        - $ref: "#/components/schemas/BillingReturnUrlRequest"
        - $ref: "#/components/schemas/CheckoutInput"
    BillingReturnUrlRequest:
      type: object
      properties:
        privacyAccepted: { type: boolean, enum: [true] }
        disclaimerAccepted: { type: boolean, enum: [true] }
        noRefundAccepted: { type: boolean, enum: [true] }
        policyVersion: { type: string, enum: ["2026-10-29.1"] }
        returnUrl:
          type: string
          format: uri
      required: [returnUrl, privacyAccepted, disclaimerAccepted, noRefundAccepted, policyVersion]
    CheckoutInput:
      type: object
      properties:
        privacyAccepted: { type: boolean, enum: [true] }
        disclaimerAccepted: { type: boolean, enum: [true] }
        noRefundAccepted: { type: boolean, enum: [true] }
        policyVersion: { type: string, enum: ["2026-10-29.1"] }
        successUrl:
          type: string
          format: uri
        cancelUrl:
          type: string
          format: uri
      required: [successUrl, cancelUrl, privacyAccepted, disclaimerAccepted, noRefundAccepted, policyVersion]
    BillingRedirectResponse:
      type: object
      properties:
        url:
          type: string
          format: uri
      required: [url]
    CheckoutResult:
      type: object
      properties:
        url:
          type: string
          format: uri
      required: [url]
    PortalInput:
      type: object
      properties:
        returnUrl:
          type: string
          format: uri
      required: [returnUrl]
    PortalResult:
      type: object
      properties:
        url:
          type: string
          format: uri
      required: [url]
    LearningProgress:
      type: object
      required: [selectedStage, xpByStage, garden]
      properties:
        selectedStage: { type: integer, minimum: 1, maximum: 4 }
        xpByStage:
          type: array
          minItems: 4
          maxItems: 4
          items: { type: integer, minimum: 0 }
        garden: { $ref: "#/components/schemas/GardenState" }
    GardenState:
      type: object
      required: [growthDays, streakDays, lastCareDate, lastCareType, daysSinceCare, caredToday, careAvailable, xpNeeded]
      properties:
        growthDays: { type: integer, minimum: 0, maximum: 30 }
        streakDays: { type: integer, minimum: 0, maximum: 30 }
        lastCareDate: { type: ["string", "null"], format: date }
        lastCareType:
          type: ["string", "null"]
          enum: [water, fertilize, null]
        daysSinceCare: { type: ["integer", "null"], minimum: 0 }
        caredToday: { type: boolean }
        careAvailable: { type: boolean }
        xpNeeded: { type: integer, minimum: 0, maximum: 20 }
    GardenCareInput:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [water, fertilize] }
    LearningProgressInput:
      type: object
      required: [selectedStage]
      properties:
        selectedStage: { type: integer, minimum: 1, maximum: 4 }
        legacyXpTotal:
          type: integer
          minimum: 0
          maximum: 400
          description: Browser-only curriculum snapshot. Repeated and higher snapshots merge without adding the same XP twice; never includes server-awarded rounds.
    ExamProgressResponse:
      type: object
      required: [membershipTier, tracks]
      properties:
        membershipTier: { type: string, enum: [none, trial, subscribed, admin] }
        tracks:
          type: array
          minItems: 2
          maxItems: 2
          items: { $ref: "#/components/schemas/ExamTrackProgress" }
    ExamTrackProgress:
      type: object
      required: [trackId, levels]
      properties:
        trackId: { type: string, enum: [hsk, psc] }
        levels:
          type: array
          items: { $ref: "#/components/schemas/ExamLevelProgress" }
    ExamLevelProgress:
      type: object
      required: [levelId, status, completedActivities, completedCount, requiredCount]
      properties:
        levelId: { type: string }
        status: { type: string, enum: [locked, available, completed] }
        completedActivities:
          type: array
          uniqueItems: true
          items: { type: string, enum: [meaning, listening, pinyin, article] }
        completedCount: { type: integer, minimum: 0, maximum: 4 }
        requiredCount: { type: integer, minimum: 4, maximum: 4 }
    RecordExamActivityInput:
      type: object
      required: [trackId, levelId, activity]
      properties:
        trackId: { type: string, enum: [hsk, psc] }
        levelId: { type: string, minLength: 1, maxLength: 8 }
        activity: { type: string, enum: [meaning, listening, pinyin, article] }
    LearningRoundInput:
      type: object
      required: [roundId, questionId, answer]
      properties:
        roundId: { type: string, format: uuid }
        questionId: { type: string, format: uuid }
        answer: { type: string, minLength: 1, maxLength: 500 }
    LearningRoundRequest:
      type: object
      required: [stage, mode, script]
      properties:
        stage: { type: integer, minimum: 1, maximum: 4 }
        mode: { type: string, enum: [match, pinyin, listen, word-order, sentence-order, focus] }
        script: { type: string, enum: [trad, simp] }
    LearningQuestion:
      type: object
      required: [id, kind, mode, speakText]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [choice, order] }
        mode: { type: string, enum: [match, pinyin, listen, word-order, sentence-order, focus] }
        prompt: { type: string }
        speakText: { type: string }
        options:
          type: array
          items: { type: string }
        word:
          type: object
          required: [id, trad, simp, pinyin, en]
          properties:
            id: { type: string }
            trad: { type: string }
            simp: { type: string }
            pinyin: { type: string }
            en: { type: string }
        chunks:
          type: array
          items: { type: string }
        clue: { type: string }
    LearningRound:
      type: object
      required: [roundId, stage, mode, questions]
      properties:
        roundId: { type: string, format: uuid }
        stage: { type: integer, minimum: 1, maximum: 4 }
        mode: { type: string, enum: [match, pinyin, listen, word-order, sentence-order, focus] }
        questions:
          type: array
          minItems: 1
          maxItems: 5
          items: { $ref: "#/components/schemas/LearningQuestion" }
    LearningAnswerResult:
      type: object
      required: [correct, selectedStage, xpByStage, xpDelta, garden]
      properties:
        correct: { type: boolean }
        selectedStage: { type: integer, minimum: 1, maximum: 4 }
        xpByStage:
          type: array
          minItems: 4
          maxItems: 4
          items: { type: integer, minimum: 0 }
        xpDelta: { type: integer, minimum: -1, maximum: 1 }
        garden: { $ref: "#/components/schemas/GardenState" }
    LegalConsentStatus:
      type: object
      required: [accepted, policyVersion]
      properties:
        accepted: { type: boolean }
        policyVersion: { type: string }
    LegalConsentInput:
      type: object
      required: [privacyAccepted, disclaimerAccepted, adultConfirmed, policyVersion]
      properties:
        privacyAccepted: { type: boolean, enum: [true] }
        disclaimerAccepted: { type: boolean, enum: [true] }
        adultConfirmed: { type: boolean, enum: [true] }
        policyVersion: { type: string, enum: ["2026-10-29.1"] }
    AccountAccess:
      type: object
      required: [isAdmin, isPremium, access]
      properties:
        isAdmin: { type: boolean }
        isPremium: { type: boolean }
        access: { type: string, enum: [active, subscription_required, deleting] }
    AccountDeletionInput:
      type: object
      required: [privacyAccepted, disclaimerAccepted, dataDeletionAccepted, noRefundAccepted, subscriptionCancellationAccepted, confirmation, policyVersion]
      properties:
        privacyAccepted: { type: boolean, enum: [true] }
        disclaimerAccepted: { type: boolean, enum: [true] }
        dataDeletionAccepted: { type: boolean, enum: [true] }
        noRefundAccepted: { type: boolean, enum: [true] }
        subscriptionCancellationAccepted: { type: boolean, enum: [true] }
        confirmation: { type: string, enum: ["DELETE"] }
        policyVersion: { type: string, enum: ["2026-10-29.1"] }
    AccountDeletionResult:
      type: object
      required: [deleted]
      properties:
        deleted: { type: boolean, enum: [true] }
    SupportThread:
      type: object
      required: [id, subject, createdAt, updatedAt, lastMessagePreview]
      properties:
        id: { type: string }
        subject: { type: string }
        createdAt: { type: string }
        updatedAt: { type: string }
        lastMessagePreview: { type: string }
    SupportMessage:
      type: object
      required: [id, author, text, createdAt]
      properties:
        id: { type: string }
        author: { type: string, enum: [parent, team] }
        text: { type: string }
        createdAt: { type: string }
    SupportConversation:
      type: object
      required: [thread, messages]
      properties:
        thread: { $ref: "#/components/schemas/SupportThread" }
        messages:
          type: array
          items: { $ref: "#/components/schemas/SupportMessage" }
    SupportThreadInput:
      type: object
      required: [subject, text]
      properties:
        subject: { type: string, minLength: 1, maxLength: 120 }
        text: { type: string, minLength: 1, maxLength: 5000 }
    SupportMessageInput:
      type: object
      required: [text]
      properties:
        text: { type: string, minLength: 1, maxLength: 5000 }
    TranslationLookupInput:
      type: object
      required: [text, script]
      properties:
        text: { type: string, minLength: 1, maxLength: 100 }
        script: { type: string, enum: ["zh-Hant", "zh-Hans"] }
    TranslationLookupResponse:
      type: object
      required: [text, translatedText, sourceLanguage, targetLanguage]
      properties:
        text: { type: string }
        translatedText: { type: string }
        sourceLanguage: { type: string, enum: [en, zh-TW, zh-CN] }
        targetLanguage: { type: string, enum: [en, zh-TW, zh-CN] }
