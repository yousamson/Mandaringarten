kind = "mobile"
previewPath = "/"
title = "漢語樂園 Mandarin Garden"
description = "漢語樂園 Mandarin Garden｜為 0–12 歲兒童設計的中英雙語漢語學習 App，涵蓋日常詞彙、拼音、短句、小遊戲與循序漸進的四級課程。 Mandarin Garden is a bilingual Mandarin learning app for children ages 0–12, with everyday vocabulary, pinyin, short sentences, games, and four progressive levels."
version = "1.0.0"
id = "artifacts/mandarin-garden"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 25091

[services.development]
run = "pnpm --filter @workspace/mandarin-garden run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mandarin-garden", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/mandarin-garden", "run", "serve" ]

[services.env]
PORT = "25091"
BASE_PATH = "/"
