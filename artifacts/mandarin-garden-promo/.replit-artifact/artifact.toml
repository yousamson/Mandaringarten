kind = "video"
videoAspectRatio = "16:9"
previewPath = "/mandarin-garden-promo/"
title = "Mandarin Garden Promo"
description = "A short animated promo introducing Mandarin Garden, a Mandarin learning playground for children ages 2–12."
version = "1.0.0"
id = "artifacts/mandarin-garden-promo"
router = "path"

[[services]]
name = "web"
paths = [ "/mandarin-garden-promo/" ]
localPort = 20620

[services.development]
run = "pnpm --filter @workspace/mandarin-garden-promo run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mandarin-garden-promo", "run", "build" ]
serve = "static"
publicDir = "artifacts/mandarin-garden-promo/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20620"
BASE_PATH = "/mandarin-garden-promo/"
